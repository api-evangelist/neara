aid: neara
name: Neara
description: >-
  Neara is a physics-enabled digital twin platform for electric utilities and
  network operators. It builds a single, physics-accurate 3D model of a
  utility's entire network from LiDAR, GIS, and imagery, then runs
  engineering-grade simulations across vegetation management, wildfire and flood
  mitigation, severe-weather response, clearance and conductor-clash analysis,
  pole utilization and FEA, asset inspection and lifecycle management, and
  transmission and distribution network design. Utilities use Neara to plan,
  harden, and operate their grids at scale — forecasting and backcasting
  resilience, prioritizing risk, and optimizing capital spend across millions of
  assets. Founded in Australia, Neara operates regionally across ANZ, the USA,
  and Europe.
